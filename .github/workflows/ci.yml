name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot-test
          POSTGRES_DB: opspilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPSPILOT_TEST_POSTGRES_URL: postgresql://opspilot:opspilot-test@localhost:5432/opspilot_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install backend
        run: uv sync --project backend --extra dev --locked
      - name: Test
        run: uv run --project backend pytest backend/tests
      - name: Lint
        run: uv run --project backend ruff check backend/app backend/tests
      - name: Type check
        run: uv run --project backend mypy backend/app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  memory-e2e:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ': > /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPSPILOT_MEMORY_E2E: "1"
      OPSPILOT_QDRANT_BASE_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install backend
        run: uv sync --project backend --extra dev --locked
      - name: Validate hybrid index and retrieval
        run: uv run --project backend pytest backend/tests/memory/test_qdrant_adapter.py
      - name: Run offline retrieval benchmark
        run: uv run --project backend python -m app.memory.eval

  mcp-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install backend
        run: uv sync --project backend --extra dev --locked
      - name: Official SDK stdio and Streamable HTTP interop
        run: uv run --project backend pytest backend/tests/mcp
      - name: Agent infrastructure contract evaluation
        run: uv run --project backend python -m app.mcp_eval

  execution-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot-test
          POSTGRES_DB: opspilot_execution
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot_execution"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPSPILOT_TEST_POSTGRES_URL: postgresql://opspilot:opspilot-test@localhost:5432/opspilot_execution
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install backend
        run: uv sync --project backend --extra dev --locked
      - name: Backend contracts, crash recovery, and reconciliation
        run: uv run --project backend pytest backend/tests/execution backend/tests/test_m8_migration.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Heuristic secret scan
        run: python scripts/check-secrets.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

  lab-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate Lab Compose
        run: docker compose -f lab/docker-compose.yml --profile demo-minimal config --quiet
      - name: Demo prerequisite doctor
        run: make demo-doctor
      - name: Run live incident recovery twice
        run: |
          make demo-local
          make demo-reset
          make demo-local
      - name: Validate fixed Ansible playbook
        run: >-
          docker compose -f lab/docker-compose.yml --profile demo-minimal run --rm lab-runner-minimal
          ansible-playbook --syntax-check
          -i /workspace/lab/ansible/inventory.ini
          /workspace/lab/ansible/playbooks/restart_service.yml
      - name: Tear down Lab
        if: always()
        run: make lab-down

  legacy-ssh-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate synthetic legacy Compose
        run: docker compose -f lab/docker-compose.yml --profile legacy config --quiet
      - name: Run governed Ansible over SSH lifecycle
        run: make legacy-demo
      - name: Start read-only doctor prerequisites
        run: docker compose -f lab/docker-compose.yml --profile legacy up -d --wait postgres legacy-host
      - name: Run read-only deployment doctor
        run: >-
          docker compose -f lab/docker-compose.yml --profile legacy run --rm --no-deps legacy-runner
          python -m app.deployment.cli doctor --profile example-legacy-test
      - name: Validate migration assessment
        run: >-
          docker compose -f lab/docker-compose.yml --profile legacy run --rm --no-deps legacy-runner
          python -m app.deployment.cli assess --profile example-legacy-test
      - name: Validate fixed deployment playbooks
        run: >-
          docker compose -f lab/docker-compose.yml --profile legacy run --rm --no-deps legacy-runner
          ansible-playbook --syntax-check
          -i /workspace/deployment/examples/inventory/legacy-test.ini
          /workspace/backend/app/deployment/playbooks/deployment_service_control.yml
      - name: Tear down synthetic legacy Lab
        if: always()
        run: make legacy-down
