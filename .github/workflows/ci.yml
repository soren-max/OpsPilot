name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install backend
        run: uv sync --project backend --extra dev --locked
      - name: Test
        run: uv run --project backend pytest backend/tests
      - name: Lint
        run: uv run --project backend ruff check backend/app backend/tests
      - name: Type check
        run: uv run --project backend mypy backend/app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Heuristic secret scan
        run: python scripts/check-secrets.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
