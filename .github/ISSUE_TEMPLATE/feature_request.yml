name: Feature request
description: Propose a scoped capability or safety improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which incident-response problem should this solve?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Describe authorization, approval, and audit implications.
    validations:
      required: true
