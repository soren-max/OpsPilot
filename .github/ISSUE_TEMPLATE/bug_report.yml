name: Bug report
description: Report a reproducible OpsPilot defect without including secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include credentials, private infrastructure details, or personal data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal, sanitized reproduction.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Validation output
      description: List relevant test, lint, and type-check results.
