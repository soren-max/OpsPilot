[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opspilot-backend"
version = "0.1.0"
description = "Action safety core for the OpsPilot incident response platform"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "pymysql>=1.1,<2",
  "pyyaml>=6.0,<7",
  "pyjwt>=2.13,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
]

[project.optional-dependencies]
lab = [
  "ansible-core>=2.18,<3",
]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]
