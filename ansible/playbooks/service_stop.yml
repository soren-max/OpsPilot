---
- name: Stop isolated demo service
  hosts: all
  gather_facts: false
  tasks:
    - name: Run allowlisted dummy stop
      ansible.builtin.command:
        argv:
          - "{{ services_script_path }}"
          - stop
          - "{{ service_name }}"
      environment:
        OPSPILOT_TEST_RUNTIME_DIR: "{{ test_runtime_directory }}"
      register: opspilot_result
      changed_when: opspilot_result.stdout is search('"changed":true')

    - name: Emit structured dummy result
      ansible.builtin.debug:
        msg: "{{ opspilot_result.stdout }}"
