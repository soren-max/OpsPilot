environment:
  name: test-fixture
  mode: integration-test
  description: Repository-only real subprocess integration fixture

executor:
  type: local_services
  timeout: 3
  retry: 1
  concurrency: 4
  partial_failure_policy: BEST_EFFORT

database:
  url: "sqlite:///./opspilot_ops_test.db"

security:
  write_operations_enabled: true
  production_operations_enabled: false
  dry_run_only: false
  execution_acknowledged: true

approval:
  required_for_write: true
  allow_self_approval: true
  minimum_approvers: 1

services:
  # Set both variables to absolute paths inside this checkout. The executor also
  # verifies that test-fixture-v2 resolves to backend/tests/fixtures/fake_services.sh.
  script_path: ${OPSPILOT_TEST_FIXTURE_SCRIPT_PATH}
  working_directory: ${OPSPILOT_TEST_FIXTURE_WORKING_DIRECTORY}
  command_profile: test-fixture-v2
  output_parser: fixture-json
  allowed_actions: [status, start, stop]

command_profiles:
  test-fixture-v2:
    capabilities: [status, start, stop]
    parser: fixture-json
    actions:
      status:
        argv: [status, "{environment}", "{host}", "{service}"]
      start:
        argv: [start, "{environment}", "{host}", "{service}"]
      stop:
        argv: [stop, "{environment}", "{host}", "{service}"]

output_parsers:
  fixture-json:
    type: json
    exit_code_map:
      4: unreachable
      7: failed
    default_state: unknown

allowlist:
  environments: [test-fixture]
  hosts: [fixture-host, fixture-host-fail]
  services:
    [running, stopped, failed, unreachable, timeout, large-output, invalid-encoding,
     partial-success, ignore-term, stateful]
  actions: [status, start, stop]
