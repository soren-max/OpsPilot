environment:
  name: mock
  mode: mock
  description: Deterministic development and demonstration environment

executor:
  type: mock
  timeout: 30
  retry: 0
  concurrency: 4
  partial_failure_policy: NONE

ansible: {}
ssh:
  enabled: false
services: {}

security:
  write_enabled: false
  production_enabled: false
  dry_run_only: true
  approval_required_for_write: true

allowlist:
  actions:
    - status
