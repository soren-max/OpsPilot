environment:
  name: production
  mode: production
  description: Production structure template only; startup is intentionally rejected

executor:
  type: ansible
  timeout: 30
  retry: 0

ansible:
  inventory_path: ${PROD_INVENTORY}
  playbook_path: ${PROD_PLAYBOOK_PATH}
  working_directory: ${PROD_WORKING_DIRECTORY}
  binary_path: ${PROD_ANSIBLE_BINARY}

ssh:
  enabled: false
  host: ${BASTION_HOST}
  port: 22
  user: ${PROD_SSH_USER}

services:
  script_path: ${SERVICES_SCRIPT_PATH}
  working_directory: ${SERVICES_WORKING_DIRECTORY}
  command_profile: pending-confirmation
  output_parser: raw_output
  allowed_actions: [status]

security:
  write_operations_enabled: false
  production_operations_enabled: false
  dry_run_only: true

approval:
  required_for_write: true
  allow_self_approval: false
  minimum_approvers: 1
