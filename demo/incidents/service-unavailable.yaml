schema_version: 1
incident:
  id: demo-service-unavailable
  title: Checkout API is unavailable
  severity: SEV1
  created_at: "2026-01-15T10:00:00Z"
service: checkout-api
environment: production
initial_symptoms:
  - Availability alert fired for checkout-api.
  - Requests return connection errors.
expected_evidence:
  - id: ev-service-up
    type: metric
    source: demo-metrics
    summary: SERVICE_UP = 0
  - id: ev-error-log
    type: log
    source: demo-logs
    summary: ERROR worker stopped accepting requests
  - id: ev-health
    type: health
    source: demo-health
    summary: Health check is unavailable
  - id: ev-ticket
    type: ticket
    source: demo-tickets
    summary: Related ticket reports a failed service start
expected_diagnosis:
  category: service_unavailable
  root_cause: checkout-api is stopped after a failed service start
  evidence_references:
    - ev-service-up
    - ev-error-log
    - ev-health
    - ev-ticket
expected_action_proposal:
  type: restart_service
  target: demo-checkout-01
  reason: Restore checkout-api after evidence confirms the service is stopped.
  risk: medium
expected_workflow_state: WAITING_APPROVAL
