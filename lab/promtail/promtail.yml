server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: lab-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 2s
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_opspilot_lab"]
        regex: "true"
        action: keep
      - source_labels: ["__meta_docker_container_label_com_opspilot_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_opspilot_environment"]
        target_label: environment
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            message: message
      - labels:
          level:
      - output:
          source: message
