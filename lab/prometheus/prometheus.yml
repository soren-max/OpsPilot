global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: lab-web-01
    static_configs:
      - targets: ["web-01:8080"]
        labels:
          service: web-01
          environment: lab
  - job_name: lab-web-02
    static_configs:
      - targets: ["web-02:8080"]
        labels:
          service: web-02
          environment: lab
  - job_name: lab-dependency
    static_configs:
      - targets: ["dependency:8080"]
        labels:
          service: dependency
          environment: lab
